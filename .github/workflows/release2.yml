name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ver=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "ver=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-cleanup: true

      - name: local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: .env stub
        run: |
          [ -f .env.example ] || printf 'API_KEY=ci_placeholder\n' > .env.example
          [ -f .env ] || cp .env.example .env

      - name: google-services.json stub
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            printf '{"project_info":{"project_number":"0","project_id":"ci-stub","storage_bucket":"ci-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0000000000000000","android_client_info":{"package_name":"com.aistudio.smartmusic.pkjv"}},"oauth_client":[],"api_key":[{"current_key":"ci-stub-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}\n' > app/google-services.json
          fi

      # ===========================================================
      # CRITICAL: decode the ORIGINAL keystore from secrets.
      # If missing -> FAIL. NEVER generate a new one.
      # ===========================================================
      - name: Decode Release Keystore (REQUIRED)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "❌ FATAL: RELEASE_KEYSTORE_BASE64 secret is not set."
            echo ""
            echo "The release APK MUST be signed with the SAME keystore"
            echo "as the previously released version, otherwise users"
            echo "cannot install the update."
            echo ""
            echo "Add these secrets in GitHub repo settings:"
            echo "  RELEASE_KEYSTORE_BASE64  (base64 of original .jks)"
            echo "  RELEASE_STORE_PASSWORD"
            echo "  RELEASE_KEY_ALIAS"
            echo "  RELEASE_KEY_PASSWORD"
            echo "  EXPECTED_CERT_SHA256     (optional safety check)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
          echo "✓ Keystore decoded ($(stat -c%s my-upload-key.jks) bytes)"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          KEYSTORE_PATH:  ${{ github.workspace }}/my-upload-key.jks
        run: |
          ./gradlew --no-daemon --no-configuration-cache --stacktrace clean assembleRelease

      - name: Verify signature
        env:
          EXPECTED: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' | head -1)
          echo "APK: $APK"
          apksigner verify --print-certs "$APK" | tee sig.txt
          ACTUAL=$(grep -i 'SHA-256 digest' sig.txt | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-Z' 'a-z')
          echo "Actual SHA-256: $ACTUAL"
          if [ -n "${EXPECTED:-}" ]; then
            EXPECTED_NORM=$(echo "$EXPECTED" | tr -d ' :' | tr 'A-Z' 'a-z')
            if [ "$ACTUAL" != "$EXPECTED_NORM" ]; then
              echo "❌ SIGNATURE MISMATCH - aborting release."
              echo "   expected: $EXPECTED_NORM"
              echo "   actual:   $ACTUAL"
              exit 1
            fi
            echo "✅ Signature matches the previous release."
          else
            echo "⚠️  EXPECTED_CERT_SHA256 not set - cannot verify signature automatically."
          fi

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p out
          find . -type f \( -path '*/build/outputs/apk/*/*.apk' \
                         -o -path '*/build/outputs/bundle/*/*.aab' \) \
            -exec cp {} out/ \;
          ls -la out/

      - name: Create / Update Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.ver }}
          name: SmartPlayer ${{ steps.v.outputs.ver }}
          generate_release_notes: true
          files: out/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
