name: Release

on:
  workflow_run:
    workflows: ["Android CI / CD Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Checkout (at CI/CD commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: echo "ver=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT

      - name: Download Release APK artifact from CI/CD
        uses: actions/download-artifact@v4
        with:
          name: SmartMusic-Release-APK
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        run: ls -la out/

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.ver }}
          name: SmartPlayer ${{ steps.v.outputs.ver }}
          generate_release_notes: true
          files: out/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
