name: Android CI / CD Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          gradle-home-cache-cleanup: true

      - name: Prepare local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Prepare .env stub
        run: |
          [ -f .env.example ] || printf 'API_KEY=ci_placeholder\n' > .env.example
          [ -f .env ] || cp .env.example .env

      - name: Decode Release Keystore (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
            echo "✓ Keystore decoded ($(stat -c%s my-upload-key.jks) bytes)"
          else
            echo "⚠️  RELEASE_KEYSTORE_BASE64 not set - release build will fail signing."
            echo "    Debug build will still succeed."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug

      - name: Build Release APK
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          KEYSTORE_PATH:  ${{ github.workspace }}/my-upload-key.jks
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleRelease

      - name: Verify Release APK signature (safety check)
        if: hashFiles('**/build/outputs/apk/release/*.apk') != ''
        run: |
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' | head -1)
          echo "APK: $APK"
          apksigner verify --print-certs "$APK" | tee sig.txt
          ACTUAL=$(grep -i 'SHA-256 digest' sig.txt | head -1 | sed 's/.*: //' | tr -d ' :' | tr 'A-Z' 'a-z')
          echo "Actual SHA-256: $ACTUAL"
          if [ -n "${EXPECTED:-}" ]; then
            EXPECTED_NORM=$(echo "$EXPECTED" | tr -d ' :' | tr 'A-Z' 'a-z')
            if [ "$ACTUAL" != "$EXPECTED_NORM" ]; then
              echo "❌ SIGNATURE MISMATCH!"
              echo "   expected: $EXPECTED_NORM"
              echo "   actual:   $ACTUAL"
              exit 1
            fi
            echo "✅ Signature matches original release"
          else
            echo "ℹ️  EXPECTED_CERT_SHA256 secret not set - skipping comparison."
          fi
        env:
          EXPECTED: ${{ secrets.EXPECTED_CERT_SHA256 }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        if: hashFiles('**/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: warn
          retention-days: 30
